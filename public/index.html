<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Resume Analyzer</title>
  <link rel="icon" href="/img/resume-logo.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header><div class="container"><a class="brand" href="/"><img src="/img/resume-logo.svg" alt="" width="38" height="38"><span>AI Resume Analyzer</span></a></div></header>
  <main class="container app-main">
    <div id="flash" class="flash alert alert-danger" role="alert" hidden></div>

    <div id="upload-view">
      <h1>Analyze your resume</h1>
      <p class="muted">Upload a PDF, DOCX or TXT file. Paste a job description to see how well you match.</p>

      <form id="upload-form">
        <label class="form-label">Resume file
          <input class="form-control" type="file" name="resume" accept=".pdf,.docx,.txt" required>
        </label>

        <label class="form-label">Job description (optional)
          <textarea class="form-control" name="job_description" rows="8" placeholder="Paste the job posting here..."></textarea>
        </label>

        <div class="form-check check">
          <input class="form-check-input" type="checkbox" id="use-ai" name="use_ai">
          <label class="form-check-label" for="use-ai">Get AI feedback</label>
        </div>

        <button class="btn btn-primary" type="submit" id="submit-btn">Analyze</button>
      </form>
    </div>

    <div id="result-view" hidden>
      <h1>Results for <span id="r-filename"></span></h1>

      <div class="score-card">
        <div class="score"><span id="r-score" class="score-value"></span><span>/100</span></div>
        <div class="muted"><span id="r-words"></span> words</div>
      </div>

      <section id="r-match-section" hidden>
        <h2>Job match: <span id="r-match"></span>%</h2>
        <p><strong>Matched:</strong> <span id="r-matched"></span></p>
        <p><strong>Missing:</strong> <span id="r-missing"></span></p>
      </section>

      <section>
        <h2>Skills found</h2>
        <div id="r-skills"></div>
      </section>

      <section>
        <h2>Sections detected</h2>
        <div id="r-sections"></div>
      </section>

      <section>
        <h2>Suggestions</h2>
        <ul id="r-tips"></ul>
      </section>

      <section id="r-ai-section" hidden>
        <h2>AI feedback</h2>
        <p id="r-ai-status" class="muted"></p>
        <pre id="r-ai" class="ai" hidden></pre>
      </section>

      <a class="btn btn-primary" href="/" id="again-btn">Analyze another</a>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
